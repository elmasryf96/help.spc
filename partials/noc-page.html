<!-- Partial: noc-page.html - split from index.html on 2026-09-06 -->
    <div id="noc-page" class="page hidden-page">
        <div class="container">
            <div data-include="partials/sub-page-header.html"></div>

            <div class="system-title">📄 NOC Certificate Generator</div>

            <div class="calc-wrapper" style="grid-template-columns: 1fr; max-width: 750px; margin: 0 auto;">
                <div class="calc-card">
                    <h3><i class="fa-solid fa-file-contract"></i> Issue NOC Certificate</h3>

                    <form id="nocForm" onsubmit="event.preventDefault(); handleNocSubmission();">
                        <div class="calc-form-grid">

                            <!-- 🔘 NOC TYPE SELECTOR -->
                            <div class="form-group" style="grid-column: 1 / -1; margin-bottom: 10px;">
                                <label for="nocTypeSelect"><i class="fa-solid fa-layer-group"></i> NOC Type:</label>
                                <select id="nocTypeSelect" onchange="toggleNocFormType()" class="combo-input" style="font-weight: 800; border-color: var(--primary-yellow); padding: 10px;">
                                    <option value="tenant">Tenant NOC</option>
                                    <option value="owner">Owner NOC</option>
                                    <option value="rent">Owner Clearance For Rent</option>
                                    <option value="movein">Move-in Clearance Letter</option>
                                </select>
                            </div>

                            <div class="section-title" id="section1Title" style="font-weight: 800; color: var(--dark-navy); margin-top: 5px; grid-column: 1 / -1;">
                                <i class="fa-solid fa-user-check" style="color: #d97706;"></i> 1. Tenant & Property Details
                            </div>

                            <div class="form-group">
                                <label><i class="fa-solid fa-building"></i> Building / Tower Name:</label>
                                <div style="display:flex; align-items:center; gap:8px;">
                                    <div style="flex:1; min-width:0;">
                                        <select id="nocTowerName" class="combo-input" required onchange="loadContractsForTower()">
                                            <option value="">-- Loading towers... --</option>
                                        </select>
                                    </div>
                                    <button type="button" id="refreshNocTowersBtn" onclick="refreshNocTowers()"
                                        title="Admin only: refresh the towers list from the billing portal"
                                        style="display:none; flex-shrink:0; align-items:center; gap:6px; padding:8px 14px; border:none; border-radius:8px; background:#dc2626; color:#fff; font-weight:600; font-size:13px; cursor:pointer;">
                                        <i class="fa-solid fa-rotate"></i> Refresh
                                    </button>
                                </div>
                                <div id="nocTowersCountLine" style="margin-top:6px; font-size:12px; color:#6b7280;"></div>
                                <div id="refreshNocTowersNote" style="display:none; margin-top:6px; font-size:12px; color:#dc2626;">
                                    <i class="fa-solid fa-lock"></i> Admin only &mdash; press <b>Refresh</b> after adding a new tower to the billing portal.
                                </div>
                            </div>

                            <div class="form-group">
                                <label><i class="fa-solid fa-magnifying-glass"></i> Select Contract (optional - auto-fills name, contract no. & unit below):</label>
                                <select id="nocContractPicker" class="combo-input" onchange="applyContractSelection()">
                                    <option value="">-- Select tower first --</option>
                                </select>
                            </div>

                            <div class="form-group" id="groupTenantName">
                                <label id="labelTenantName"><i class="fa-solid fa-user"></i> Tenant Consumer Name:</label>
                                <input type="text" id="nocTenantName" class="combo-input" placeholder="e.g. Timur Yeginzhanov">
                            </div>

                            <div class="form-group">
                                <label><i class="fa-solid fa-door-closed"></i> Unit / Apartment No.:</label>
                                <input type="text" id="nocUnitNo" class="combo-input" placeholder="e.g. Unit B1-519" required>
                            </div>

                            <div class="form-group" id="groupTenantContract">
                                <label id="labelTenantContract"><i class="fa-solid fa-file-signature"></i> Tenant Contract Number:</label>
                                <input type="text" id="nocTenantContract" class="combo-input" placeholder="e.g. TBO-B1-519-O2">
                            </div>

                            <!-- 🟢 MOVE-IN SPECIFIC FIELDS -->
                            <div class="form-group" id="groupMoveInAccountType" style="display: none;">
                                <label id="labelMoveInAccountType"><i class="fa-solid fa-users-gear"></i> Account Type:</label>
                                <select id="moveInAccountType" class="combo-input" style="font-weight: 800; padding: 10px;">
                                    <option value="TENANT">TENANT</option>
                                    <option value="OWNER">OWNER</option>
                                </select>
                            </div>

                            <div class="form-group" id="groupMoveInSpcAccount" style="display: none;">
                                <label id="labelMoveInSpcAccount"><i class="fa-solid fa-hashtag"></i> SPC Account Number:</label>
                                <input type="text" id="moveInSpcAccount" class="combo-input" placeholder="e.g. CST21106T5">
                            </div>

                            <div class="form-group">
                                <label><i class="fa-solid fa-calendar-day"></i> NOC Issue Date:</label>
                                <input type="date" id="nocDate" class="date-input" required>
                            </div>

                            <div class="calc-divider" style="grid-column: 1 / -1;"></div>

                            <div class="section-title" id="section2Title" style="font-weight: 800; color: var(--dark-navy); grid-column: 1 / -1;">
                                <i class="fa-solid fa-user-tie" style="color: #d97706;"></i> 2. Owner Details (Optional)
                            </div>

                            <div class="form-group" id="groupOwnerContractPicker" style="grid-column: 1 / -1;">
                                <label><i class="fa-solid fa-magnifying-glass"></i> Select Owner's Contract (optional - auto-fills owner name below, leave as N/A if none):</label>
                                <select id="nocOwnerContractPicker" class="combo-input" onchange="applyOwnerContractSelection()">
                                    <option value="">-- Select tower first --</option>
                                </select>
                            </div>

                            <div class="form-group" id="groupOwnerName">
                                <label id="labelOwnerName"><i class="fa-solid fa-user"></i> Owner Consumer Name:</label>
                                <input type="text" id="nocOwnerName" class="combo-input" placeholder="e.g. N/A or Owner Full Name">
                            </div>

                            <div class="form-group" id="groupOwnerContract">
                                <label id="labelOwnerContract"><i class="fa-solid fa-file-invoice"></i> Owner Contract Number:</label>
                                <input type="text" id="nocOwnerContract" class="combo-input" placeholder="e.g. N/A or Owner Contract No.">
                            </div>

                            <div style="display: flex; gap: 10px; margin-top: 15px; grid-column: 1 / -1;">
                                <button type="button" id="btnNocReset" onclick="resetNocForm()" class="ccp-edit-btn-secondary" style="flex: 0 0 130px; font-size: 15px;">
                                    <i class="fa-solid fa-rotate-left"></i> Reset
                                </button>
                                <button type="submit" id="btnNocSubmit" class="btn-primary" style="padding: 12px; font-size: 15px; flex: 1;">
                                    🚀 Generate & Download NOC PDF
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div id="noc-banner-container"></div>
        </div>
    </div>
