<!-- Partial: cc-pulse-page.html - split from index.html on 2026-09-06 -->
    <div id="cc-pulse-page" class="page hidden-page">
        <div class="container">
            <div data-include="partials/sub-page-header.html"></div>

            <div class="system-title">📡 CC Pulse - Live Agent Status</div>

            <div id="ccPulseLiveGrid" class="ccp-live-grid">
                <!-- Populated by JS -->
            </div>

            <div class="ccp-report-box">
                <div class="ccp-report-controls">
                    <select id="ccPulseAgentSelect" class="combo-input">
                        <option value="__all__">All agents</option>
                    </select>

                    <div class="ccp-mode-bar">
                        <button id="ccpMode_day" class="ccp-mode-btn active" onclick="setCcPulseMode('day')">Day</button>
                        <button id="ccpMode_range" class="ccp-mode-btn" onclick="setCcPulseMode('range')">Date range</button>
                        <button id="ccpMode_month" class="ccp-mode-btn" onclick="setCcPulseMode('month')">Whole month</button>
                    </div>
                </div>

                <div class="ccp-mode-inputs">
                    <div id="ccpModeBox_day" class="ccp-mode-box">
                        <input type="date" id="ccpDayInput">
                    </div>
                    <div id="ccpModeBox_range" class="ccp-mode-box" style="display: none;">
                        <input type="date" id="ccpRangeStartInput">
                        <span>to</span>
                        <input type="date" id="ccpRangeEndInput">
                    </div>
                    <div id="ccpModeBox_month" class="ccp-mode-box" style="display: none;">
                        <input type="month" id="ccpMonthInput">
                    </div>
                </div>

                <button class="btn-primary" onclick="loadCcPulseReport()">
                    <i class="fa-solid fa-chart-line"></i> View report
                </button>

                <div id="ccPulseReportResult" class="ccp-report-result"></div>
            </div>

            <div id="cc-pulse-banner-container"></div>
        </div>
    </div>
