    <!-- 🔑 USER PROFILE & CHANGE PASSWORD MODAL -->
    <div id="changePasswordModal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="max-width: 420px; border-radius: 16px;">
            <div class="modal-header">
                <h3><i class="fa-solid fa-id-card" style="color: var(--dark-navy);"></i> User Profile & Security</h3>
                <button class="close-modal-btn" onclick="closeChangePasswordModal()">&times;</button>
            </div>
            <div class="modal-body" style="padding: 20px;">
                
                <div style="background: var(--badge-bg); border: 1.5px solid var(--primary-yellow); border-radius: 12px; padding: 12px 15px; margin-bottom: 18px;">
                    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px; border-bottom: 1px dashed #d4c255; padding-bottom: 8px;">
                        <i class="fa-solid fa-circle-user" style="font-size: 30px; color: var(--dark-navy);"></i>
                        <div>
                            <div id="modalProfileFullName" style="font-weight: 800; font-size: 15px; color: var(--dark-navy);">-</div>
                            <div id="modalProfileUsername" style="font-size: 11px; font-weight: 700; color: #64748b;">@username</div>
                        </div>
                    </div>
                    <div style="font-size: 12.5px; font-weight: 700; color: var(--dark-navy); display: flex; align-items: center; gap: 6px;">
                        <i class="fa-solid fa-envelope" style="color: #d97706;"></i>
                        <span id="modalProfileEmail">-</span>
                    </div>
                </div>

                <h4 style="margin: 0 0 10px 0; font-size: 13.5px; font-weight: 800; color: var(--dark-navy); border-bottom: 1.5px solid var(--primary-yellow); padding-bottom: 4px;">
                    <i class="fa-solid fa-lock"></i> Change Password
                </h4>

                <form onsubmit="event.preventDefault(); submitPasswordChange();">
                    <div class="form-group" style="margin-bottom: 10px;">
                        <label style="font-size: 12px;"><i class="fa-solid fa-key"></i> Current Password</label>
                        <div class="pass-input-wrapper">
                            <input type="password" id="oldPasswordInput" class="combo-input" placeholder="Enter current password" required autocomplete="off">
                            <button type="button" class="toggle-eye-btn" onclick="togglePassVisibility('oldPasswordInput', this)"><i class="fa-solid fa-eye"></i></button>
                        </div>
                    </div>
                    <div class="form-group" style="margin-bottom: 10px;">
                        <label style="font-size: 12px;"><i class="fa-solid fa-lock-open"></i> New Password</label>
                        <div class="pass-input-wrapper">
                            <input type="password" id="newPasswordInput" class="combo-input" placeholder="Enter new password" required autocomplete="off">
                            <button type="button" class="toggle-eye-btn" onclick="togglePassVisibility('newPasswordInput', this)"><i class="fa-solid fa-eye"></i></button>
                        </div>
                    </div>
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label style="font-size: 12px;"><i class="fa-solid fa-check-double"></i> Confirm New Password</label>
                        <div class="pass-input-wrapper">
                            <input type="password" id="confirmPasswordInput" class="combo-input" placeholder="Confirm new password" required autocomplete="off">
                            <button type="button" class="toggle-eye-btn" onclick="togglePassVisibility('confirmPasswordInput', this)"><i class="fa-solid fa-eye"></i></button>
                        </div>
                    </div>
                    <div id="passChangeMsg" style="font-size: 12px; font-weight: bold; margin-bottom: 12px; display: none; text-align: center;"></div>
                    <button type="submit" class="btn-login" style="width: 100%; padding: 10px; font-size: 14px;">Update Password</button>
                </form>
            </div>
        </div>
    </div>
