<div class="search-box">
    <div class="form-row-2col">
        <div class="input-group-field">
            <label for="nocTowerSelect">Select Building / Tower Name:</label>
            <select id="nocTowerSelect" class="combo-input" onchange="handleNocChange()">
                <option value="">-- Choose Building --</option>
            </select>
        </div>
        <div class="input-group-field">
            <label for="nocUserType">Select Applicant Type:</label>
            <select id="nocUserType" class="combo-input" onchange="handleNocChange()">
                <option value="">-- Choose Type --</option>
                <option value="owner">Owner</option>
                <option value="tenant">Tenant</option>
            </select>
        </div>
    </div>
</div>
